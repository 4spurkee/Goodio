
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoLink</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #101114;
    color: #eee;
    font-family: Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    background: #191b20;
    padding: 28px;
    border: 1px solid #303238;
    border-radius: 14px;
}

h1 { font-size: 25px; margin: 0 0 8px; }
p { color: #999; font-size: 14px; }

input {
    width: 100%;
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
    border: 1px solid #383a42;
    background: #101114;
    color: white;
    outline: none;
}

button {
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #e5e5e5;
    color: #111;
    cursor: pointer;
    font-weight: bold;
}

button:hover { background: #bbb; }

#result {
    display: none;
    margin-top: 22px;
}

.output {
    overflow-wrap: anywhere;
    background: #101114;
    padding: 14px;
    border-radius: 8px;
    font-size: 12px;
    color: #aaa;
    margin: 12px 0;
}

.actions {
    display: flex;
    gap: 10px;
}
</style>
</head>
<body>

<div class="container">
    <h1>VideoLink</h1>
    <p>Direct video URL viewer</p>

    <input
        id="videoUrl"
        placeholder="Paste a direct MP4 video URL..."
    >

    <button onclick="convert()">Get video link</button>

    <div id="result">
        <p>Video URL:</p>
        <div class="output" id="output"></div>
        <div class="actions">
            <button onclick="copyLink()">Copy link</button>
            <button onclick="openVideo()">Open video</button>
        </div>
    </div>
</div>

<script>
let currentUrl = "";

function convert() {
    const input = document.getElementById("videoUrl").value.trim();

    try {
        const url = new URL(input);

        if (url.protocol !== "https:" && url.protocol !== "http:") {
            throw new Error();
        }

        if (!/\.(mp4|webm|ogg)(\?|$)/i.test(url.pathname)) {
            throw new Error();
        }

        currentUrl = url.href;

        document.getElementById("output").textContent = currentUrl;
        document.getElementById("result").style.display = "block";

    } catch {
        alert("Please enter a valid direct video URL.");
    }
}

function copyLink() {
    navigator.clipboard.writeText(currentUrl);
}

function openVideo() {
    window.open(currentUrl, "_blank", "noopener");
}
</script>

</body>
</html>
